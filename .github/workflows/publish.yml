name: "publish"

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
      - "[0-9]*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: "是否发布 GitHub Release (true = 发布 Release; false = 仅构建并上传安装包)"
        required: true
        type: boolean
        default: true
      prerelease:
        description: "是否标记为预发布版本 (Pre-release)"
        required: false
        type: boolean
        default: false
      draft:
        description: "是否发布为草稿 (Draft Release)"
        required: false
        type: boolean
        default: false

jobs:
  build-and-publish:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Run Workspace Tests
        shell: pwsh
        run: |
          cargo test --workspace

      - name: Prepare Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          if ($ref -match "^v?([0-9]+\.[0-9]+(?:\.[0-9]+)?)") {
            $ver = $matches[1]
          } else {
            $ver = "0.1.6"
          }
          $docPath = "docs/release-notes/v$ver.md"

          if (Test-Path $docPath) {
            Write-Host "Found release notes at $docPath"
            $body = Get-Content $docPath -Raw -Encoding utf8
          } elseif (Test-Path "CHANGELOG.md") {
            Write-Host "Extracting release notes from CHANGELOG.md..."
            $changelog = Get-Content "CHANGELOG.md" -Raw -Encoding utf8
            if ($changelog -match "(?ms)## \[$ver\].*?(?=(## \[|$))") {
              $body = $matches[0]
            } else {
              $body = "MacTouchpad 自动化构建版本。可在下方下载安装程序。"
            }
          } else {
            $body = "MacTouchpad 自动化构建版本。可在下方下载安装程序。"
          }

          $delimiter = [System.Guid]::NewGuid().ToString()
          "RELEASE_BODY<<$delimiter`n$body`n$delimiter" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Determine Publish Mode
        id: check_publish
        shell: pwsh
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $isManualPublish = "${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.publish_release }}" -eq "true"
          $shouldPublish = $isTag -or $isManualPublish
          Write-Host "Should publish release: $shouldPublish"
          "SHOULD_PUBLISH=$shouldPublish" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and Publish Release
        if: env.SHOULD_PUBLISH == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MacTouchpad ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}

      - name: Build Installer (CI / PR / Non-Release)
        if: env.SHOULD_PUBLISH != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        if: env.SHOULD_PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MacTouchpad-Windows-Build
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/mac-touchpad.exe
          if-no-files-found: warn